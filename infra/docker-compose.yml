# Local backing services (spec §2). The API applies `server/migrations` itself
# on startup (sqlx), so Postgres starts empty. The Rust services and the client run on the
# host during development (see scripts/dev.mjs); add
# `--profile app` to also run them in containers.
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml --profile app up -d --build

name: commons

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: commons
      POSTGRES_DB: commons
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commons"]
      interval: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: commons
      MINIO_ROOT_PASSWORD: commons-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  # ---- application services (optional; normally run on the host) ----

  api:
    profiles: [app]
    build: { context: .., dockerfile: infra/Dockerfile.server, args: { BIN: api } }
    environment: &app_env
      COMMONS_DEV: "true"
      COMMONS_LOG_JSON: "true"
      COMMONS_CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgres://commons:commons@postgres:5432/commons
      COMMONS_API_INTERNAL_URL: http://api:8080
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]

  orchestrator:
    profiles: [app]
    build: { context: .., dockerfile: infra/Dockerfile.server, args: { BIN: orchestrator } }
    environment:
      <<: *app_env
      ZONE_PUBLIC_URL: ws://localhost:8082/ws
    ports: ["8081:8081"]

  zone:
    profiles: [app]
    build: { context: .., dockerfile: infra/Dockerfile.server, args: { BIN: zone } }
    environment: *app_env
    ports: ["8082:8082"]

volumes:
  pgdata:
  miniodata:
